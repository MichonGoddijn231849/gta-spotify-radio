name: Release

# Two ways in, both publishing the same thing:
#   - push a v* tag, or
#   - run this workflow manually with the version to release, in which case
#     the tag is created as part of publishing.
#
# Release notes come from the matching section of CHANGELOG.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_TAG
          } else {
            $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            throw "Version '$tag' is not of the form vMAJOR.MINOR.PATCH"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Collect release notes
        shell: pwsh
        run: |
          $section = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s+(\S+)') {
              if ($inSection) { break }
              $inSection = ($Matches[1] -eq $env:RELEASE_TAG)
              continue
            }
            if ($inSection) { $section += $line }
          }
          if (($section -join '').Trim() -eq '') {
            throw "CHANGELOG.md has no '## $env:RELEASE_TAG' section"
          }
          $section -join "`n" | Out-File -FilePath notes.md -Encoding utf8

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build\GtaSpotifyRadio.asi package\
          Copy-Item GtaSpotifyRadio.ini package\
          Copy-Item INSTALL.md package\
          Copy-Item LICENSE package\
          Copy-Item THIRD_PARTY_NOTICES.md package\
          Compress-Archive -Path package\* -DestinationPath "GtaSpotifyRadio-$env:RELEASE_TAG.zip"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            "GtaSpotifyRadio-$env:RELEASE_TAG.zip" `
            --title "GTA Spotify Radio $env:RELEASE_TAG" `
            --notes-file notes.md `
            --target $env:GITHUB_SHA
