name: Release

# Pushing a v* tag builds the plugin and publishes it. The release notes are
# taken from the tag's own message, so the tag is the single place a release
# is described:
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Needed for the annotated tag object, which carries the notes.
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build\GtaSpotifyRadio.asi package\
          Copy-Item GtaSpotifyRadio.ini package\
          Copy-Item INSTALL.md package\
          Copy-Item LICENSE package\
          Copy-Item THIRD_PARTY_NOTICES.md package\
          Compress-Archive -Path package\* -DestinationPath "GtaSpotifyRadio-$env:GITHUB_REF_NAME.zip"

      - name: Collect release notes
        shell: pwsh
        run: |
          $notes = git tag -l --format='%(contents)' $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($notes)) {
            # A lightweight tag carries no message; fall back to generated notes.
            "generate=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $notes | Out-File -FilePath notes.md -Encoding utf8
            "generate=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
        id: notes

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "GtaSpotifyRadio-$env:GITHUB_REF_NAME.zip"
          $title = "GTA Spotify Radio $env:GITHUB_REF_NAME"
          if ("${{ steps.notes.outputs.generate }}" -eq "true") {
            gh release create $env:GITHUB_REF_NAME $zip --title $title --generate-notes
          } else {
            gh release create $env:GITHUB_REF_NAME $zip --title $title --notes-file notes.md
          }
