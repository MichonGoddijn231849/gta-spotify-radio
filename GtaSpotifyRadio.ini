[Radio]
; SelfRadio  - ride on Self Radio (RADIO_19_USER). The plugin drops a silent
;              placeholder track into your user music folder so the station
;              appears on the wheel and plays nothing of its own.
; Replace    - take over an existing station instead. The native station is
;              frozen and muted while you are tuned to it.
Mode=SelfRadio

; Station to own. SelfRadio mode expects RADIO_19_USER.
; Replace mode takes any station name, e.g. RADIO_02_POP.
Station=RADIO_19_USER

; Station the F7 hotkey returns to when switching Spotify off.
FallbackStation=RADIO_01_CLASS_ROCK

; Ask the game to un-hide the station on the radio wheel.
UnlockStation=1

; Keep the station playing on foot through the phone radio.
MobileRadio=1

; Replace mode only: stop the hijacked station's own timeline while we own it.
FreezeNativeStation=1

; Replace mode only: audio scenes tried in order until one reports active.
; The first one that starts is used to mute the native station.
MuteScenes=MP_JOB_CHANGE_RADIO_MUTE,FBI_HEIST_H5_MUTE_RADIO_SCENE,CHARACTER_CHANGE_IN_SKY_SCENE

[SelfRadio]
; Write a silent MP3 into the GTA user music folder so Self Radio has
; something to "play". After it appears you must rescan user music once in
; Settings > Audio.
GenerateSilentTrack=1
SilentTrackMinutes=30

; Leave blank to search Documents (including OneDrive-redirected ones) for
; Rockstar Games\<game>\User Music. If the log says no folder was found, set
; the full path here, e.g.
; UserMusicDir=C:\Users\You\Documents\Rockstar Games\GTA V Enhanced\User Music
UserMusicDir=

[Audio]
; Trim on top of Spotify's loudness normalisation, in dB. GTA's own stations
; are mastered hotter than Spotify's -14 LUFS target, so a small boost lands
; closer to them. Raise or lower this to match the native stations by ear.
VolumeDb=2.0

; Follow the in-game Music volume slider.
FollowMusicSlider=1

; Exponent mapping the 0-10 slider onto amplitude. Higher = quieter mid-slider.
SliderCurve=2.0

; Pin the slider to a fixed 0-10 value instead of reading it, or -1 to read it.
MusicSliderOverride=-1

; Spotify Connect device volume the app starts at (0-65535).
SpotifyVolume=65535

; Per-track loudness normalisation.
ReplayGain=1

; Local PCM buffer in milliseconds. Larger survives hitches, smaller reacts
; faster to the game pausing.
BufferMs=700

[Mix]
; Duck while characters, phone calls or scripted conversations are talking.
DuckOnDialogue=1
DialogueDuckDb=-11.0

; Level heard from outside the vehicle, and how far it carries.
ExteriorGainDb=-7.0
ExteriorRangeMeters=16.0

; Follow the game's own radio fade (mission mutes, retune sweeps). Set to 0 if
; Replace mode leaves the station permanently silent.
RespectGameRadioFade=1

; Low-pass muffling for the cabin, from outside the car, and underwater.
CabinFilter=1
InteriorCutoffHz=15000
ExteriorCutoffHz=2600
SubmergedCutoffHz=700

; Fade length for starts, stops and ducking, in milliseconds.
FadeMs=90

; How long the output stays silent before the Spotify stream itself is held.
StreamPauseDelayMs=1200

[Controls]
; Windows virtual-key codes: F7=118, F8=119, F9=120, F10=121.
SelectStation=118
PlayPause=120
Next=121
Previous=119
